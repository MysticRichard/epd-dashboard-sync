[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epd-dashboard-sync"
version = "0.1.0"
description = "Opportunity-based BLE dashboard synchronization for EPD-nRF5 displays"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "EPD Dashboard Sync contributors"}]
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]
keywords = ["epd", "e-paper", "ble", "codex", "github", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/example-org/epd-dashboard-sync"
Issues = "https://github.com/example-org/epd-dashboard-sync/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
ble = ["bleak>=0.22"]

[project.scripts]
epd-dashboard = "epd_dashboard_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epd_dashboard_sync = ["assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
